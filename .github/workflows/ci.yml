name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Tests need only repository contents. In particular, pull requests receive no
# credential capable of publishing artifacts or modifying repository state.
permissions:
  contents: read

# A newer push supersedes an older run for the same branch. Release
# qualification remains a separate explicit operation and is never cancelled by
# this development workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-aarch64:
    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            bootstrap_cxx: clang++
            llvm_dir: /opt/homebrew/opt/llvm@22/lib/cmake/llvm
            parallel: 3
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            bootstrap_cxx: g++
            llvm_dir: /usr/lib/llvm-22/lib/cmake/llvm
            parallel: 4

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # LLVM 22 is a pinned bootstrap component on both hosts. Draft links its C
      # API for object emission; Clang/lld and the utilities remain available as
      # the qualification oracle, platform linker driver, and archiver.
      - name: Install macOS LLVM development libraries
        if: runner.os == 'macOS'
        run: brew install llvm@22

      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake software-properties-common wget
          wget --quiet https://apt.llvm.org/llvm.sh --output-document /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install --yes llvm-22-dev

      # Log both compilers when they differ. A runner-image update is then
      # visible in a failed job without making ambient versions semantic pins.
      - name: Record tool versions
        run: |
          cmake --version
          ${{ matrix.bootstrap_cxx }} --version
          "${{ matrix.llvm_dir }}/../../../bin/clang" --version
          "${{ matrix.llvm_dir }}/../../../bin/llvm-config" --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=${{ matrix.bootstrap_cxx }} \
            -DLLVM_DIR=${{ matrix.llvm_dir }} \
            -DDRAFT_WARNINGS_AS_ERRORS=ON \
            -DDRAFT_ENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build --parallel ${{ matrix.parallel }}

      # CMake includes the exhaustive classified example matrix, Draft example
      # tests/benchmarks, foreign-provider and C-client linking, executable
      # conformance, artifact determinism, and embedded-LLVM/Clang parity only
      # on a supported native host. A green row therefore proves native
      # execution for that OS rather than cross-lowering alone.
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel ${{ matrix.parallel }}

  sanitizers-x86-64:
    name: Native + sanitizers / Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Stop at the first report so the failing operation remains close to the
      # useful stack. Leak detection is explicit rather than inherited from a
      # runner image's ambient sanitizer configuration.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install bootstrap toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake software-properties-common wget
          wget --quiet https://apt.llvm.org/llvm.sh --output-document /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          sudo apt-get install --yes llvm-22-dev

      # This native job is intentionally a different architecture from the ARM
      # matrix. Assert the hosted-runner contract instead of accidentally
      # turning it into a duplicate ARM build after a label change.
      - name: Record tool versions
        run: |
          test "$(uname -m)" = x86_64
          cmake --version
          g++ --version
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm \
            -DDRAFT_WARNINGS_AS_ERRORS=ON \
            -DDRAFT_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel 4

      # x86-64 is a full native Draft target. This sanitizer row therefore runs
      # the same executable, C-client, example, terminal/TUI, determinism, and
      # backend-parity integration gates as the AArch64 rows while ASan/UBSan
      # instrument the bootstrap compiler and test harnesses.
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  native-windows-x86-64:
    name: Native / Windows x86-64
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      LLVM_VERSION: 22.1.6
      LLVM_ARCHIVE_SHA256: 657343edf361ca463bd642e39c74b251c6338b96cdbd55ff277555298b027696

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # LLVM does not offer the monolithic libLLVM dylib on Windows. Its
      # official development archive contains LLVM-C.dll, Clang, lld-link,
      # llvm-lib, headers, and CMake exports from one exact release. Cache the
      # extracted tree by release and official SHA-256 so ordinary CI runs do
      # not repeatedly transfer the large upstream package.
      - name: Restore LLVM 22 development archive
        id: llvm-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\llvm-22.1.6
          key: llvm-windows-x86-64-22.1.6-657343edf361

      - name: Install LLVM 22 development archive
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "llvm-$env:LLVM_VERSION.tar.xz"
          $destination = Join-Path $env:RUNNER_TEMP "llvm-$env:LLVM_VERSION"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/clang%2Bllvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:LLVM_ARCHIVE_SHA256) {
            throw "LLVM archive SHA-256 mismatch: expected $env:LLVM_ARCHIVE_SHA256, got $actual"
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          tar -xf $archive -C $destination --strip-components=1

      - name: Select LLVM 22 tools
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "llvm-$env:LLVM_VERSION"
          if (-not (Test-Path (Join-Path $root "lib\cmake\llvm\LLVMConfig.cmake"))) {
            throw "LLVM development archive has no CMake package"
          }
          "LLVM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $root "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Record tool versions
        shell: pwsh
        run: |
          cmake --version
          & "$env:LLVM_ROOT\bin\clang.exe" --version

      # The Windows row builds the real bootstrap with MSVC warnings as errors.
      # POSIX-shaped C++ harnesses are not registered here; the following
      # target-specific gate performs native Draft execution through draftc.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLVM_DIR="$env:LLVM_ROOT\lib\cmake\llvm" `
            -DDRAFT_WARNINGS_AS_ERRORS=ON `
            -DDRAFT_ENABLE_SANITIZERS=OFF `
            -DBUILD_TESTING=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      # Clang's MSVC driver needs the selected Visual Studio/Windows SDK LIB and
      # INCLUDE environment. draftc inherits that exact environment when it
      # launches Clang and lld-link for the real PE/COFF programs below.
      - name: Qualify native Draft programs and C interoperation
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          if errorlevel 1 exit /b 1
          cmake -DDRAFTC="%CD%\build\Release\draftc.exe" -DCLANG="%LLVM_ROOT%\bin\clang.exe" -DSOURCE_ROOT="%CD%" -DTEST_ROOT="%CD%\build\windows-native-smoke" -P "%CD%\tests\driver_windows_native_smoke_test.cmake"
          if errorlevel 1 exit /b 1
